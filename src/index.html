<!doctype html>
<html lang="zh-Hant"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>速度線研究所 · Pokémon Champions</title><link rel="stylesheet" href="./css/style.css"></head>
<body><header><div class="brand"><span class="logo">↟</span><div><small>POKÉMON CHAMPIONS</small><h1>速度線研究所</h1></div></div><span class="version">LOCAL / v0.1 <b>Champions 1.2.0 名單</b></span></header>
<main>
<nav class="mobile-pages" aria-label="手機頁面切換"><button type="button" data-page="speed" aria-current="page">速度線</button><button type="button" data-page="search">搜尋</button></nav>
<div class="workspace" id="workspace"><section class="panel comparison" id="speed-page"><div class="section-head"><div><small>01 / SPEED COMPARISON</small><h2>速度線</h2></div><button id="edit-team" class="primary">⚙ 設定自身寶可夢 <span id="team-count">0/6</span></button></div>
<div class="chart-legend"><span class="green">● 我方參照</span><span class="coral">━ 目標範圍</span><button type="button" id="trick-room" aria-pressed="false">戲法空間</button><span id="speed-direction">↑ 速度越快</span></div>
<div id="chart" aria-label="速度比較軸"></div><div class="controls"><div id="own-controls"></div><div id="target-controls"></div></div>
</section><aside id="search-page"><section class="panel filters"><div class="filter-heading"><small>02 / FIND YOUR TARGET</small><h2>搜尋與篩選</h2><button id="reset-filters" class="reset" type="button" aria-label="重置篩選" title="重置篩選"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12a8 8 0 1 0 2.34-5.66"/><path d="M4 4v4h4"/></svg></button></div><label class="search"><span class="sr-only">搜尋寶可夢</span><input id="search" type="search" placeholder="中文、英文或圖鑑編號…" autocomplete="off"></label><div id="types" class="type-grid" aria-label="屬性與單屬性篩選"></div><div id="generations" class="generation-grid" aria-label="本體初登場世代篩選"></div><div id="mega-debuts" class="mega-debut-grid" aria-label="Mega 初登場作品篩選"></div></section>
<section class="panel results"><div class="section-head"><h2>搜尋結果 <span id="result-count"></span></h2><small>點選以比較</small></div><div id="results"></div></section></aside><div class="deck-controls"><button type="button" data-deck="speed" aria-label="顯示速度線">‹</button><button type="button" data-deck="search" aria-label="顯示搜尋">›</button></div></div>
<footer>離線使用 · 隊伍保存在此裝置 <span>非官方粉絲工具 / DEMO DATA</span></footer></main>
<dialog id="team-dialog"><form id="team-form"><div class="section-head"><div><small>YOUR REFERENCE POINTS</small><h2>我的隊伍</h2></div><button type="button" id="close-team" aria-label="關閉隊伍設定">✕</button></div><div id="team-rows" aria-label="目前隊伍"></div><div class="pokepaste-import"><label for="pokepaste-input">匯入 PokePaste（以 50 等計算）</label><textarea id="pokepaste-input" rows="3" placeholder="貼上 PokePaste 連結或隊伍文字…"></textarea><button id="import-pokepaste" type="button">取代目前隊伍並匯入</button><span id="pokepaste-status" role="status"></span></div><div class="team-picker"><label class="team-search">搜尋寶可夢<input id="team-search" type="search" placeholder="名稱或圖鑑編號…" autocomplete="off"></label><div class="team-type-label">屬性篩選<div id="team-type-filter" class="type-grid" aria-label="依屬性篩選"></div></div><div id="team-pool" role="listbox" aria-label="可加入的寶可夢"></div></div><div class="dialog-actions"><span id="team-picker-count"></span><button class="primary" type="submit">儲存隊伍</button></div></form></dialog>
<div id="toast" role="status"></div><script type="module" src="./js/app.js"></script></body></html>
