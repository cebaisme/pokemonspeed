name: Windows release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - run: npm ci
      - run: npm test
      - run: npm run tauri -- build
      - uses: actions/upload-artifact@v4
        with:
          name: champions-speed-windows
          path: src-tauri/target/release/bundle/nsis/*.exe
      - name: Create draft release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          gh release create $env:GITHUB_REF_NAME --draft --title "Champions Speed Tool $env:GITHUB_REF_NAME" --notes "Windows 示範版。資料與速度公式仍待核實；詳見 README。" src-tauri/target/release/bundle/nsis/*.exe
